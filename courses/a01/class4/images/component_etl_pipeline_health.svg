<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="400" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />
  <rect width="496" height="396" x="2" y="2" rx="10" fill="url(#cardGrad)" />

  <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ETL Pipeline Health / 知識庫清洗管道監控</text>

  <g transform="translate(24, 70)" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    <!-- Progress 1 -->
    <text x="0" y="15" fill="#9ca3af" font-size="11">政府 PDF / API 數據注入率 (Data Ingestion Rate)</text>
    <text x="410" y="15" fill="#4ade80" font-weight="800" font-size="11">98.5%</text>
    <rect x="0" y="24" width="450" height="8" rx="4" fill="#1c113b" />
    <rect x="0" y="24" width="443.25" height="8" rx="4" fill="url(#greenGrad)" />
    
    <!-- Progress 2 -->
    <text x="0" y="65" fill="#9ca3af" font-size="11">知識切片向量化進度 (Embedding Vectorization)</text>
    <text x="410" y="65" fill="#38bdf8" font-weight="800" font-size="11">100%</text>
    <rect x="0" y="74" width="450" height="8" rx="4" fill="#1c113b" />
    <rect x="0" y="74" width="450" height="8" rx="4" fill="url(#blueGrad)" filter="url(#glowBlue)" />

    <!-- Progress 3 -->
    <text x="0" y="115" fill="#9ca3af" font-size="11">垃圾雜訊與無效字元過濾率 (Noise Filtering Rate)</text>
    <text x="410" y="115" fill="#c084fc" font-weight="800" font-size="11">92.4%</text>
    <rect x="0" y="124" width="450" height="8" rx="4" fill="#1c113b" />
    <rect x="0" y="124" width="415.8" height="8" rx="4" fill="url(#purpleGrad)" />

    <!-- Vector DB Auto-Sync Status -->
    <g transform="translate(0, 160)">
      <rect width="450" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="#25174d" stroke-width="1" />
      <text x="16" y="30" fill="#ffffff" font-size="11">向量資料庫排程自動同步 (Vector DB Auto-Sync)</text>
      <circle cx="375" cy="25" r="4.5" fill="#4ade80" filter="url(#glowGreen)" />
      <text x="390" y="29" fill="#4ade80" font-size="11" font-weight="800">ACTIVE</text>
    </g>
  </g>
  
  <line x1="24" y1="315" x2="476" y2="315" stroke="#25174d" stroke-width="1" />
  <text x="24" y="342" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" font-weight="500">本機 ETL 引擎每 6 小時自動對比政府工業館與 Tcloud 最新發布</text>
</svg>
