    <!-- Gauge (Center 245, 175) -->
    <path d="M 125 190 A 120 120 0 0 1 365 190" fill="none" stroke="#1c113b" stroke-width="26" stroke-linecap="round" />
    <!-- 89.2% path (Arc from left to right, angle = 89.2% of 180 = 160.5 degrees) -->
    <!-- dasharray calculation: semi-perimeter = pi * r = 3.14159 * 120 = 377. Let's use dasharray and dashoffset -->
    <circle cx="245" cy="190" r="120" fill="none" stroke="url(#greenGrad)" stroke-width="26" 
            stroke-dasharray="377" stroke-dashoffset="40.7" transform="rotate(-180 245 190)" stroke-linecap="round" filter="url(#glowGreen)" />
            
