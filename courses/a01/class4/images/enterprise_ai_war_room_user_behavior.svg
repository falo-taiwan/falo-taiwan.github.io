    <text x="20" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="36" font-weight="900" filter="url(#glowBlue)">1,248 <tspan font-size="16" font-weight="700" fill="#9ca3af"> 次</tspan></text>
    <rect x="220" y="15" width="40" height="40" rx="8" fill="rgba(56, 189, 248, 0.08)" />
    <!-- Chat Icon -->
    <path d="M228 35h12v-10h-20v14l4-4h4z" fill="#38bdf8" />
  </g>

  <!-- Card 2: Thumbs-up Rate -->
