    <text x="20" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">API STATUS / 雲端連線狀態</text>
    <text x="20" y="68" fill="#14b8a6" font-family="system-ui, sans-serif" font-size="32" font-weight="900">ACTIVE <tspan font-size="16" font-weight="700" fill="#9ca3af"> / 安全</tspan></text>
