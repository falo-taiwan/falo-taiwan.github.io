    <text x="20" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">THUMBS-UP RATE / 當日好評率</text>
    <text x="20" y="68" fill="#4ade80" font-family="system-ui, sans-serif" font-size="36" font-weight="900" filter="url(#glowGreen)">89.2% <tspan font-size="16" font-weight="700" fill="#9ca3af"> 👍</tspan></text>
    <rect x="220" y="15" width="40" height="40" rx="8" fill="rgba(74, 222, 128, 0.08)" />
