    <text x="20" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SECURITY ALERTS / 攻擊攔截</text>
    <text x="20" y="68" fill="#ef4444" font-family="system-ui, sans-serif" font-size="36" font-weight="900" filter="url(#glowRed)">8 <tspan font-size="16" font-weight="700" fill="#9ca3af"> 次攔截</tspan></text>
    <rect x="220" y="15" width="40" height="40" rx="8" fill="rgba(239, 68, 68, 0.08)" />
    <!-- Shield Alert Icon -->
    <path d="M240 23l-10 4v10a10 10 0 0 0 10 10 10 10 0 0 0 10-10v-10zm-1 6h2v10h-2zm0 12h2v2h-2z" fill="#ef4444" />
  </g>

  <!-- Card 4: Daily Token Save -->
  <g transform="translate(970, 120)">
    <rect width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.3" />
    <text x="20" y="28" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TOKEN SAVED / 快取節省 Token</text>
    <text x="20" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="36" font-weight="900">90.4% <tspan font-size="16" font-weight="700" fill="#9ca3af"> 節能</tspan></text>
    <rect x="220" y="15" width="40" height="40" rx="8" fill="rgba(192, 132, 252, 0.08)" />
