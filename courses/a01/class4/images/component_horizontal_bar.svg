<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="400" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />
  <rect width="496" height="396" x="2" y="2" rx="10" fill="url(#cardGrad)" />

  <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Top Queries &amp; Gap / 熱門搜尋與知識缺口</text>

  <g transform="translate(24, 70)" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">
    <!-- Item 1 -->
    <text x="0" y="20" font-size="12" fill="#ffffff">1. 資安成熟度補助 (Security Grant)</text>
    <rect x="0" y="30" width="380" height="12" rx="4" fill="#1c113b" />
    <rect x="0" y="30" width="320" height="12" rx="4" fill="url(#purpleGrad)" />
    <text x="330" y="40" fill="#c084fc" font-weight="800">48次</text>

    <!-- Item 2 -->
    <text x="0" y="70" font-size="12" fill="#ffffff">2. 研發經費自籌比例 (R&amp;D Co-funding)</text>
    <rect x="0" y="80" width="380" height="12" rx="4" fill="#1c113b" />
    <rect x="0" y="80" width="240" height="12" rx="4" fill="url(#blueGrad)" />
    <text x="250" y="90" fill="#38bdf8" font-weight="800">36次</text>

    <!-- Item 3 -->
    <text x="0" y="120" font-size="12" fill="#ffffff">3. 智慧製造升級專案 (Smart Manufacturing)</text>
    <rect x="0" y="130" width="380" height="12" rx="4" fill="#1c113b" />
    <rect x="0" y="130" width="190" height="12" rx="4" fill="url(#greenGrad)" />
    <text x="200" y="140" fill="#4ade80" font-weight="800">28次</text>

    <!-- Item 4 -->
    <text x="0" y="170" font-size="12" fill="#ffffff">4. 人資訓練補助條件 (HR Training)</text>
    <rect x="0" y="180" width="380" height="12" rx="4" fill="#1c113b" />
    <rect x="0" y="180" width="140" height="12" rx="4" fill="url(#orangeGrad)" />
    <text x="150" y="190" fill="#f59e0b" font-weight="800">22次</text>

    <!-- Item 5 -->
    <text x="0" y="220" font-size="12" fill="#ffffff">5. 碳盤查與減碳補助 (Carbon Audit)</text>
    <rect x="0" y="230" width="380" height="12" rx="4" fill="#1c113b" />
    <rect x="0" y="230" width="100" height="12" rx="4" fill="#6b7280" />
    <text x="110" y="240" fill="#9ca3af" font-weight="800">15次</text>
  </g>
  
  <line x1="24" y1="320" x2="476" y2="320" stroke="#25174d" stroke-width="1" />
  <text x="24" y="348" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" font-weight="500">高頻率查詢但低滿意度字詞，代表需要增量 ETL 清洗的知識缺口</text>
</svg>
