<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="400" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />
  <rect width="496" height="396" x="2" y="2" rx="10" fill="url(#cardGrad)" />

  <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Target Industry Heatmap / 適用產業熱力矩陣</text>

  <g transform="translate(24, 70)" font-family="system-ui, sans-serif" font-size="9" font-weight="700">
    <!-- Column Labels -->
    <text x="90" y="0" text-anchor="middle" fill="#6b7280">資訊科技</text>
    <text x="170" y="0" text-anchor="middle" fill="#6b7280">智慧製造</text>
    <text x="250" y="0" text-anchor="middle" fill="#6b7280">批發零售</text>
    <text x="330" y="0" text-anchor="middle" fill="#6b7280">生技醫療</text>
    <text x="410" y="0" text-anchor="middle" fill="#6b7280">金融科技</text>
    
    <!-- Row 1 -->
    <text x="0" y="38" fill="#9ca3af" font-size="10" text-anchor="start">人資知識</text>
    <rect x="60" y="20" width="60" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.6" stroke="#c084fc" stroke-width="1" />
    <rect x="140" y="20" width="60" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.5" />
    <rect x="220" y="20" width="60" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
    <rect x="300" y="20" width="60" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.4" stroke="#c084fc" stroke-width="1" />
    <rect x="380" y="20" width="60" height="30" rx="4" fill="#8b5cf6" fill-opacity="0.3" stroke="#c084fc" stroke-width="1" />
    
    <!-- Row 2 -->
    <text x="0" y="88" fill="#9ca3af" font-size="10" text-anchor="start">客服溝通</text>
    <rect x="60" y="70" width="60" height="30" rx="4" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1" />
    <rect x="140" y="70" width="60" height="30" rx="4" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1" />
    <rect x="220" y="70" width="60" height="30" rx="4" fill="#0284c7" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="300" y="70" width="60" height="30" rx="4" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1" />
    <rect x="380" y="70" width="60" height="30" rx="4" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />

    <!-- Row 3 -->
    <text x="0" y="138" fill="#9ca3af" font-size="10" text-anchor="start">行銷銷售</text>
    <rect x="60" y="120" width="60" height="30" rx="4" fill="#16a34a" fill-opacity="0.4" stroke="#4ade80" stroke-width="1" />
    <rect x="140" y="120" width="60" height="30" rx="4" fill="#16a34a" fill-opacity="0.5" stroke="#4ade80" stroke-width="1" />
    <rect x="220" y="120" width="60" height="30" rx="4" fill="#16a34a" fill-opacity="0.9" stroke="#4ade80" stroke-width="1.5" />
    <rect x="300" y="120" width="60" height="30" rx="4" fill="#16a34a" fill-opacity="0.3" stroke="#4ade80" stroke-width="1" />
    <rect x="380" y="120" width="60" height="30" rx="4" fill="#16a34a" fill-opacity="0.3" stroke="#4ade80" stroke-width="1" />

    <!-- Row 4 -->
    <text x="0" y="188" fill="#9ca3af" font-size="10" text-anchor="start">生產工安</text>
    <rect x="60" y="170" width="60" height="30" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <rect x="140" y="170" width="60" height="30" rx="4" fill="#d97706" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="220" y="170" width="60" height="30" rx="4" fill="#d97706" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <rect x="300" y="170" width="60" height="30" rx="4" fill="#d97706" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1" />
    <rect x="380" y="170" width="60" height="30" rx="4" fill="#d97706" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.5" />

    <!-- Highly concentrated tags -->
    <text x="170" y="38" fill="#ffffff" font-size="8" text-anchor="middle">極高</text>
    <text x="250" y="88" fill="#ffffff" font-size="8" text-anchor="middle">極高</text>
    <text x="250" y="138" fill="#ffffff" font-size="8" text-anchor="middle">極高</text>
    <text x="170" y="188" fill="#ffffff" font-size="8" text-anchor="middle">極高</text>
  </g>

  <!-- Legend for Intensity -->
  <g transform="translate(24, 290)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
    <text x="0" y="12" fill="#9ca3af">熱度分級：</text>
    <rect x="70" y="0" width="14" height="14" rx="2" fill="#8b5cf6" fill-opacity="0.2" />
    <rect x="88" y="0" width="14" height="14" rx="2" fill="#8b5cf6" fill-opacity="0.5" />
    <rect x="106" y="0" width="14" height="14" rx="2" fill="#8b5cf6" fill-opacity="0.8" />
    <rect x="124" y="0" width="14" height="14" rx="2" fill="#8b5cf6" stroke="#c084fc" stroke-width="1" />
    <text x="145" y="12" fill="#6b7280">低熱度 ➔ 高熱度分佈</text>
  </g>
  
  <line x1="24" y1="325" x2="476" y2="325" stroke="#25174d" stroke-width="1" />
  <text x="24" y="352" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" font-weight="500">本圖表以熱力視覺化展示 244 筆補助專案的產業適用度分佈</text>
</svg>
