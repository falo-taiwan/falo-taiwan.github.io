<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowPurple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Subtle Border background -->
  <rect width="318" height="158" x="1" y="1" rx="12" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <!-- Central Coordinator Node -->
  <circle cx="160" cy="80" r="18" fill="url(#glowPurple2)" stroke="url(#purpleGrad2)" stroke-width="2" />
  <text x="160" y="83" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Orch</text>
  
  <!-- Surrounding Specialized Agents -->
  <!-- 1. Workflow Agent (Top Left) -->
  <g transform="translate(60, 45)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#purpleGrad2)" stroke-width="1.5" />
    <path d="M-6,-2 h12 M-6,2 h12" stroke="url(#purpleGrad2)" stroke-width="1" />
    <text x="0" y="24" fill="rgba(255, 255, 255, 0.5)" font-size="8" font-family="sans-serif" text-anchor="middle">Workflow</text>
  </g>
  
  <!-- 2. OCR / ETL Agent (Bottom Left) -->
  <g transform="translate(70, 115)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#purpleGrad2)" stroke-width="1.5" />
    <path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="url(#purpleGrad2)" stroke-width="1" />
    <text x="0" y="24" fill="rgba(255, 255, 255, 0.5)" font-size="8" font-family="sans-serif" text-anchor="middle">OCR / ETL</text>
  </g>
  
  <!-- 3. Audit Agent (Top Right) -->
  <g transform="translate(260, 45)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#purpleGrad2)" stroke-width="1.5" />
    <path d="M-4,0 L-1,3 L5,-3" fill="none" stroke="url(#purpleGrad2)" stroke-width="1.5" />
    <text x="0" y="24" fill="rgba(255, 255, 255, 0.5)" font-size="8" font-family="sans-serif" text-anchor="middle">Audit</text>
  </g>
  
  <!-- 4. HITL Agent (Bottom Right) -->
  <g transform="translate(250, 115)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#purpleGrad2)" stroke-width="1.5" />
    <!-- Human & Robot icon representation -->
    <circle cx="0" cy="-3" r="3" fill="url(#purpleGrad2)" />
    <path d="M-6,7 A6,6 0 0 1 6,7 Z" fill="url(#purpleGrad2)" />
    <text x="0" y="24" fill="rgba(255, 255, 255, 0.5)" font-size="8" font-family="sans-serif" text-anchor="middle">HITL</text>
  </g>
  
  <!-- Collaborative Connection Lines (Bidirectional) -->
  <g stroke="url(#purpleGrad2)" stroke-width="1" opacity="0.6" fill="none">
    <!-- Orch to Workflow -->
    <line x1="145" y1="70" x2="73" y2="49" />
    <!-- Orch to OCR/ETL -->
    <line x1="148" y1="88" x2="82" y2="109" />
    <!-- Orch to Audit -->
    <line x1="175" y1="70" x2="247" y2="49" />
    <!-- Orch to HITL -->
    <line x1="172" y1="88" x2="238" y2="109" />
    
    <!-- Outer ring collaboration path -->
    <path d="M60,45 A110,110 0 0 1 260,45" stroke-dasharray="3,3" />
    <path d="M70,115 A110,110 0 0 0 250,115" stroke-dasharray="3,3" />
  </g>
</svg>
