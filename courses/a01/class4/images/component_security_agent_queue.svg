<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="400" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />
  <rect width="496" height="396" x="2" y="2" rx="10" fill="url(#cardGrad)" />

  <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Security &amp; Agent Queue / 安全與協作佇列</text>

  <!-- Security Telemetry Sub-panel -->
  <g transform="translate(24, 60)">
    <rect width="450" height="100" rx="6" fill="rgba(239, 68, 68, 0.02)" stroke="#ef4444" stroke-width="1" stroke-opacity="0.2" />
    <text x="16" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">🚨 實時合規與資安威脅警報 (Security Telemetry)</text>
    
    <!-- Alarm 1 -->
    <g transform="translate(16, 32)">
      <rect width="125" height="52" rx="4" fill="#180c12" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="10" y="16" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" font-weight="700">PROMPT 注入</text>
      <text x="10" y="40" fill="#ef4444" font-family="system-ui, sans-serif" font-size="20" font-weight="900" filter="url(#glowRed)">8 <tspan font-size="10" fill="#9ca3af">次攔截</tspan></text>
    </g>
    
    <!-- Alarm 2 -->
    <g transform="translate(155, 32)">
      <rect width="125" height="52" rx="4" fill="#180c12" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.5" />
      <text x="10" y="16" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" font-weight="700">敏感詞警告</text>
      <text x="10" y="40" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="20" font-weight="900">0 <tspan font-size="10" fill="#9ca3af">次</tspan></text>
    </g>

    <!-- Alarm 3 -->
    <g transform="translate(295, 32)">
      <rect width="140" height="52" rx="4" fill="rgba(20, 184, 166, 0.03)" stroke="#14b8a6" stroke-width="0.8" stroke-opacity="0.3" />
      <text x="10" y="16" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CORS 跨域異常</text>
      <text x="10" y="40" fill="#14b8a6" font-family="system-ui, sans-serif" font-size="20" font-weight="900">0 <tspan font-size="10" fill="#9ca3af">次 (安全)</tspan></text>
    </g>
  </g>

  <!-- Multi-Agent Queue Sub-panel -->
  <g transform="translate(24, 175)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🤖 Micro-Agents Queue / 智能體自治協同佇列</text>
    
    <g transform="translate(0, 32)" font-family="system-ui, sans-serif" font-size="10" font-weight="700">
      <!-- Agent 1 -->
      <g transform="translate(0, 0)">
        <rect width="450" height="34" rx="4" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="0.8" />
        <circle cx="16" cy="17" r="3.5" fill="#4ade80" filter="url(#glowGreen)" />
        <text x="30" y="21" fill="#ffffff" font-size="10">ETL-Data-Cleaner-Agent (資料清洗去重)</text>
        <rect x="385" y="7" width="55" height="18" rx="3" fill="rgba(74, 222, 128, 0.1)" />
        <text x="412.5" y="19" fill="#4ade80" text-anchor="middle" font-size="9">🟢 IDLE</text>
      </g>

      <!-- Agent 2 -->
      <g transform="translate(0, 42)">
        <rect width="450" height="34" rx="4" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="0.8" />
        <circle cx="16" cy="17" r="3.5" fill="#38bdf8" filter="url(#glowBlue)" />
        <text x="30" y="21" fill="#ffffff" font-size="10">RAG-Semantic-Search-Agent (相似度比對)</text>
        <rect x="385" y="7" width="55" height="18" rx="3" fill="rgba(56, 189, 248, 0.15)" />
        <text x="412.5" y="19" fill="#38bdf8" text-anchor="middle" font-size="9">🔵 RUNNING</text>
      </g>

      <!-- Agent 3 -->
      <g transform="translate(0, 84)">
        <rect width="450" height="34" rx="4" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="0.8" />
        <circle cx="16" cy="17" r="3.5" fill="#4ade80" filter="url(#glowGreen)" />
        <text x="30" y="21" fill="#ffffff" font-size="10">Report-Generator-Agent (診斷報告一鍵生成)</text>
        <rect x="385" y="7" width="55" height="18" rx="3" fill="rgba(74, 222, 128, 0.1)" />
        <text x="412.5" y="19" fill="#4ade80" text-anchor="middle" font-size="9">🟢 IDLE</text>
      </g>

      <!-- Agent 4 -->
      <g transform="translate(0, 126)">
        <rect width="450" height="34" rx="4" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="0.8" />
        <circle cx="16" cy="17" r="3.5" fill="#38bdf8" filter="url(#glowBlue)" />
        <text x="30" y="21" fill="#ffffff" font-size="10">Audit-Logger-Agent (操作安全與稽核日誌)</text>
        <rect x="385" y="7" width="55" height="18" rx="3" fill="rgba(56, 189, 248, 0.15)" />
        <text x="412.5" y="19" fill="#38bdf8" text-anchor="middle" font-size="9">🔵 RUNNING</text>
      </g>
    </g>
  </g>
  
  <line x1="24" y1="330" x2="476" y2="330" stroke="#25174d" stroke-width="1" />
  <text x="24" y="356" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" font-weight="500">協同佇列反映後台 Micro-Agents 工作流之即時運行狀態</text>
</svg>
