<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Subtle Border background -->
  <rect width="318" height="158" x="1" y="1" rx="12" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
  
  <!-- Left Side: Unstructured Data -->
  <g transform="translate(20, 42)">
    <rect x="0" y="0" width="60" height="70" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="30" y="-8" fill="rgba(255, 255, 255, 0.4)" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">Unstructured</text>
    <!-- Messy elements -->
    <circle cx="20" cy="20" r="4" fill="#f59e0b" opacity="0.75" />
    <rect x="35" y="15" width="8" height="8" fill="#ef4444" opacity="0.75" />
    <path d="M15,45 L25,55 M25,45 L15,55" stroke="#3b82f6" stroke-width="2" opacity="0.75" />
    <circle cx="45" cy="50" r="5" fill="#10b981" opacity="0.75" />
  </g>
  
  <!-- Middle: Transformer / Filter Gear -->
  <g transform="translate(130, 47)">
    <circle cx="30" cy="30" r="28" fill="url(#glowPurple)" stroke="url(#purpleGrad)" stroke-width="2" />
    <!-- Gear or Star representation -->
    <path d="M30,12 L33,22 L43,22 L35,28 L38,38 L30,32 L22,38 L25,28 L17,22 L27,22 Z" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="30" y="73" fill="url(#purpleGrad)" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Structure Engine</text>
    
    <!-- Flow Lines -->
    <path d="M-40,25 L-15,25" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M75,25 L100,25" stroke="url(#purpleGrad)" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>
  
  <!-- Right Side: Structured Data -->
  <g transform="translate(230, 42)">
    <rect x="0" y="0" width="60" height="70" rx="6" fill="none" stroke="url(#purpleGrad)" stroke-width="2" />
    <text x="30" y="-8" fill="url(#purpleGrad)" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">Clean JSON</text>
    <!-- Structured lines resembling code -->
    <rect x="10" y="14" width="40" height="5" rx="1.5" fill="#38bdf8" opacity="0.85" />
    <rect x="10" y="26" width="30" height="5" rx="1.5" fill="#8b5cf6" opacity="0.85" />
    <rect x="10" y="38" width="35" height="5" rx="1.5" fill="#38bdf8" opacity="0.85" />
    <rect x="10" y="50" width="20" height="5" rx="1.5" fill="#8b5cf6" opacity="0.85" />
  </g>
</svg>
