<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="400" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />
  <rect width="496" height="396" x="2" y="2" rx="10" fill="url(#cardGrad)" />

  <text x="24" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Multi-Agent Queue / 多智能體自治協同佇列</text>

  <g transform="translate(24, 70)" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
    <!-- Agent 1 -->
    <g transform="translate(0, 0)">
      <rect width="450" height="42" rx="6" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="1" />
      <circle cx="20" cy="21" r="4.5" fill="#4ade80" filter="url(#glowGreen)" />
      <text x="36" y="25" fill="#ffffff" font-size="11">ETL-Data-Cleaner-Agent (資料清洗去重)</text>
      <rect x="375" y="11" width="60" height="20" rx="4" fill="rgba(74, 222, 128, 0.1)" />
      <text x="405" y="24" fill="#4ade80" text-anchor="middle" font-size="10">🟢 IDLE</text>
    </g>

    <!-- Agent 2 -->
    <g transform="translate(0, 52)">
      <rect width="450" height="42" rx="6" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="1" />
      <circle cx="20" cy="21" r="4.5" fill="#38bdf8" filter="url(#glowBlue)" />
      <text x="36" y="25" fill="#ffffff" font-size="11">RAG-Semantic-Search-Agent (語意檢索)</text>
      <rect x="375" y="11" width="60" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" />
      <text x="405" y="24" fill="#38bdf8" text-anchor="middle" font-size="10">🔵 RUNNING</text>
    </g>

    <!-- Agent 3 -->
    <g transform="translate(0, 104)">
      <rect width="450" height="42" rx="6" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="1" />
      <circle cx="20" cy="21" r="4.5" fill="#4ade80" filter="url(#glowGreen)" />
      <text x="36" y="25" fill="#ffffff" font-size="11">Report-Generator-Agent (一鍵診斷報告)</text>
      <rect x="375" y="11" width="60" height="20" rx="4" fill="rgba(74, 222, 128, 0.1)" />
      <text x="405" y="24" fill="#4ade80" text-anchor="middle" font-size="10">🟢 IDLE</text>
    </g>

    <!-- Agent 4 -->
    <g transform="translate(0, 156)">
      <rect width="450" height="42" rx="6" fill="rgba(255,255,255,0.01)" stroke="#1c113b" stroke-width="1" />
      <circle cx="20" cy="21" r="4.5" fill="#38bdf8" filter="url(#glowBlue)" />
      <text x="36" y="25" fill="#ffffff" font-size="11">Audit-Logger-Agent (操作安全與歷程稽核)</text>
      <rect x="375" y="11" width="60" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" />
      <text x="405" y="24" fill="#38bdf8" text-anchor="middle" font-size="10">🔵 RUNNING</text>
    </g>
  </g>
  
  <line x1="24" y1="315" x2="476" y2="315" stroke="#25174d" stroke-width="1" />
  <text x="24" y="342" fill="#6b7280" font-family="system-ui, sans-serif" font-size="11" font-weight="500">協同佇列反映後台 Micro-Agents 工作流之即時運行狀態</text>
</svg>
