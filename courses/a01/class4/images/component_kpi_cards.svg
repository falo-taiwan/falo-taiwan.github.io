<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 130" width="1520" height="130">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f35" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080314" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1520" height="130" fill="#020108" rx="12" stroke="#25174d" stroke-width="1.5" />

  <!-- Card 1: Total Tools -->
  <g transform="translate(20, 20)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">TOTAL AI TOOLS / 方案總數</text>
    <text x="18" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="32" font-weight="900" filter="url(#glowBlue)">244 <tspan font-size="14" font-weight="700" fill="#9ca3af"> 筆</tspan></text>
    <rect x="210" y="15" width="36" height="36" rx="6" fill="rgba(56, 189, 248, 0.08)" />
    <path d="M216 23h6v2h10v-2h6v14h-28z" fill="#38bdf8" />
  </g>

  <!-- Card 2: Active Providers -->
  <g transform="translate(320, 20)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVE PROVIDERS / 活躍廠商</text>
    <text x="18" y="65" fill="#c084fc" font-family="system-ui, sans-serif" font-size="32" font-weight="900" filter="url(#glowPurple)">128 <tspan font-size="14" font-weight="700" fill="#9ca3af"> 家</tspan></text>
    <rect x="210" y="15" width="36" height="36" rx="6" fill="rgba(192, 132, 252, 0.08)" />
    <path d="M220 21h14v22h-14zm3 5h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z" fill="#c084fc" />
  </g>

  <!-- Card 3: Median Budget -->
  <g transform="translate(620, 20)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">MEDIAN BUDGET / 預算中位數</text>
    <text x="18" y="63" fill="#4ade80" font-family="system-ui, sans-serif" font-size="24" font-weight="900" filter="url(#glowGreen)">NT$ 65,000 <tspan font-size="12" font-weight="700" fill="#9ca3af">/起</tspan></text>
    <rect x="210" y="15" width="36" height="36" rx="6" fill="rgba(74, 222, 128, 0.08)" />
    <path d="M226 21h-3v3h-3v2h3v10h3v-10h3v-2h-3zm-1 5a2 2 0 0 1 0 4 2 2 0 0 1 0-4z" fill="#4ade80" />
  </g>

  <!-- Card 4: Daily LLM API Calls -->
  <g transform="translate(920, 20)">
    <rect width="270" height="90" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">DAILY API CALLS / 今日 API 呼叫</text>
    <text x="18" y="65" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="32" font-weight="900" filter="url(#glowOrange)">15.4K <tspan font-size="14" font-weight="700" fill="#9ca3af"> 次</tspan></text>
    <rect x="210" y="15" width="36" height="36" rx="6" fill="rgba(245, 158, 11, 0.08)" />
    <path d="M213 33h7l3-8l4 16l3-12l3 4h8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Card 5: Avg Response Time -->
  <g transform="translate(1220, 20)">
    <rect width="280" height="90" rx="8" fill="url(#cardGrad)" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="26" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">AVG RESPONSE TIME / 平均響應</text>
    <text x="18" y="65" fill="#14b8a6" font-family="system-ui, sans-serif" font-size="32" font-weight="900">1.24 <tspan font-size="14" font-weight="700" fill="#9ca3af"> 秒</tspan></text>
    <rect x="220" y="15" width="36" height="36" rx="6" fill="rgba(20, 184, 166, 0.08)" />
    <circle cx="238" cy="33" r="8" fill="none" stroke="#14b8a6" stroke-width="2" />
    <path d="M238 28v5l3 2" fill="none" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
